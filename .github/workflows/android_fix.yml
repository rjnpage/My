name: Build APK Fixed

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Build APK (no wrapper)
      run: gradle build || true

    - name: Try assembleDebug
      run: gradle assembleDebug || true

